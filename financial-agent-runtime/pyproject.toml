[project]
name = "financial-agent-runtime"
version = "0.1.3"
description = "Shared runtime helpers for the Daily Report LangGraph agent."
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.6.1",
    "langchain-daytona>=0.0.7",
    "langchain-openai>=0.3.0",
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
