# Deep Orchestrator - Configuration
# Safe defaults only. Put API keys in the workspace root ../.env.

model:
  default: "qwen-3.7-max"
  max_tokens: 32000
  base_url: "https://dashscope.aliyuncs.com/compatible-mode"
  api_key: ""
  thinking: "auto"

# The orchestrator has no tools/IO config of its own: it delegates to the 6
# native subagents via the built-in `task` tool and writes its synthesis with
# the built-in filesystem tools. Each subagent owns its own model/MCP config.
