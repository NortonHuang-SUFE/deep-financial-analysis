default_model: volcengine-glm-5.2
default_multimodal_model: minimax-m3
models:
  minimax-m3:
    model: MiniMax-M3
    base_url: https://api.minimaxi.com/v1
    api_key_env: MINIMAX_API_KEY
    max_tokens: 16000
    thinking: auto
  aliyun-ds:
    model: deepseek-v3
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api_key_env: DASHSCOPE_API_KEY
    max_tokens: 16000
    thinking: auto
  aliyun-qwen-max:
    model: qwen-max
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api_key_env: DASHSCOPE_API_KEY
    max_tokens: 16000
    thinking: auto
  aliyun-minimax-m3:
    model: MiniMax/MiniMax-M3
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api_key_env: DASHSCOPE_API_KEY
    max_tokens: 16000
    thinking: auto
  volcengine-glm-5.2:
    model: glm-5-2-260617
    base_url: https://ark.cn-beijing.volces.com/api/v3
    api_key_env: ARK_API_KEY
    max_tokens: 16000
    thinking: auto
