default_model: volcengine-glm-5.2-plan
default_multimodal_model: aliyun-minimax-m3
models:
  minimax-m3:
    model: MiniMax-M3
    base_url: https://api.minimaxi.com/v1
    api_key_env: MINIMAX_API_KEY
    max_tokens: 524288
  aliyun-ds:
    model: deepseek-v4-pro
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api_key_env: DASHSCOPE_API_KEY
    max_tokens: 65536
  aliyun-qwen-max:
    model: qwen-max
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api_key_env: DASHSCOPE_API_KEY
    max_tokens: 8192
  aliyun-minimax-m3:
    model: MiniMax/MiniMax-M3
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api_key_env: DASHSCOPE_API_KEY
    max_tokens: 128000
  aliyun-kimi-k3:
    model: kimi/kimi-k3
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api_key_env: DASHSCOPE_API_KEY
    max_tokens: 131072
    thinking: enabled
    reasoning_effort: max
  aliyun-glm-5.2-fast:
    model: glm-5.2-fast-preview
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api_key_env: DASHSCOPE_API_KEY
    max_tokens: 131072
    thinking: disabled
  aliyun-glm-5.2:
    model: glm-5.2
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api_key_env: DASHSCOPE_API_KEY
    max_tokens: 131072
    thinking: disabled
  volcengine-glm-5.2:
    model: glm-5.2
    base_url: https://ark.cn-beijing.volces.com/api/v3
    api_key_env: ARK_STANDARD_API_KEY
    max_tokens: 128000
    thinking: disabled
  volcengine-glm-5.2-plan:
    model: glm-5.2
    base_url: https://ark.cn-beijing.volces.com/api/plan/v3
    api_key_env: ARK_API_KEY
    max_tokens: 128000
    thinking: disabled
agent_models:
  daily_report:
    model: volcengine-glm-5.2-plan
    multimodal_fallback_model: minimax-m3
  morning_note:
    model: volcengine-glm-5.2-plan
    multimodal_fallback_model: minimax-m3
  html_image_renderer:
    model: aliyun-minimax-m3
    multimodal_fallback_model: minimax-m3
