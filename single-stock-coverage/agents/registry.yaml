# Human-readable wiring for the single-stock-coverage Deep Agents stack.
#
# Tool groups describe where runtime tools come from. Agent entries below
# choose tool groups and skill names explicitly so each agent's context is
# auditable without opening graph.py.

tool_groups:
  coverage_artifact_tools:
    description: Coverage run directory, artifact writers, manifest, and state tools.
    tools:
      - create_coverage_run_dir
      - write_markdown_artifact
      - write_json_artifact
      - update_run_manifest
      - write_coverage_state

  mcp_tools:
    description: Runtime MCP tools loaded from enabled servers in single-stock-coverage/config.yaml.
    source: config.yaml:mcp
    servers: enabled

  dcf_execution_tools:
    description: Local deterministic DCF-builder tools imported from ../DCF-builder.
    tools:
      - build_comps_excel
      - build_dcf_model
      - validate_dcf_model
      - write_assumption_analysis
      - write_valuation_summary

  task2_check_tools:
    description: Task 2 parent handoff, artifact verification, reconciliation, and compact audit tools.
    tools:
      - resolve_task2_handoff
      - verify_task2_artifacts
      - reconcile_statement_specs
      - write_task2_model_audit

  run_manifest_tools:
    description: Run manifest update tool for parent coordinators after typed gates pass.
    tools:
      - update_run_manifest

  task2_financial_fact_artifact_tools:
    description: Task 2 financial facts JSON writer; must use the parent-resolved run_dir.
    tools:
      - write_json_artifact

  task2_audit_artifact_tools:
    description: Task 2 model audit Markdown writer; must use the parent-resolved run_dir.
    tools:
      - write_markdown_artifact

  statement_modeling_tools:
    description: Shared Task 2 statement JSON context, validation, and write tools.
    tools:
      - read_statement_context
      - validate_income_statement_json
      - write_income_statement_json
      - validate_balance_sheet_json
      - write_balance_sheet_json
      - validate_cash_flow_json
      - write_cash_flow_json

  workbook_authoring_tools:
    description: Task 2 workbook child tools for final Excel build and validation.
    tools:
      - build_integrated_three_statement_model
      - validate_integrated_three_statement_model

  workbook_update_tools:
    description: Task 2 update child tools for prior-workbook refresh and validation.
    tools:
      - update_integrated_three_statement_model
      - validate_integrated_three_statement_model

skill_sources:
  single_stock_coverage:
    path: ./skills
    description: Project skills for the single-stock coverage workflow.
  dcf_builder:
    path: ../DCF-builder/skills
    description: DCF-builder skills used only by the Task 3 DCF execution child.

agents:
  single_stock_coverage:
    prompt: single-stock-coverage.md
    description: Root single-stock coverage orchestrator.
    parent:
    level: 0
    role: Root orchestrator that creates the coverage run and delegates Tasks 1-5.
    inputs:
      - target company/ticker request
      - task type and triggering event
    outputs:
      - coverage run directory
      - run manifest
      - coverage state
    tool_groups:
      - coverage_artifact_tools
    skills: {}
    subagents:
      - task1_company_researcher
      - task2_financial_modeler
      - task3_valuation_analyst
      - task4_chart_pack_generator
      - task5_report_assembler

  task1_company_researcher:
    prompt: task1-company-researcher.md
    description: Produces company_research.md, business_driver_map.json, and source_log.json for one target company.
    parent: single_stock_coverage
    level: 1
    role: Company research worker for Task 1 evidence gathering and business driver mapping.
    inputs:
      - target company/ticker request
      - coverage run directory
    outputs:
      - 01_company_research/company_research.md
      - 01_company_research/business_driver_map.json
      - 01_company_research/source_log.json
    tool_groups:
      - mcp_tools
      - coverage_artifact_tools
    skills:
      single_stock_coverage:
        - company-research
    subagents: []

  task2_financial_modeler:
    prompt: task2-financial-modeler.md
    description: Parent coordinator for Task 2 model updates, child task assignment, statement reconciliation, handoff checks, and manifest updates.
    parent: single_stock_coverage
    level: 1
    role: Task 2 parent that verifies prerequisites, delegates facts/statement/workbook work to children, runs reconciliation checks, and updates the run manifest.
    inputs:
      - 01_company_research/company_research.md
      - 01_company_research/business_driver_map.json
      - 01_company_research/source_log.json
    outputs:
      - 02_financial_model/financial_facts.json
      - 02_financial_model/task2_context_packet.json
      - 02_financial_model/statement_spec_pack.json
      - 02_financial_model/integrated_model.xlsx
      - 02_financial_model/model_audit.md
    tool_groups:
      - task2_check_tools
      - run_manifest_tools
    skills:
      single_stock_coverage:
        - model-update
        - statement-reconciliation-checks
    subagents:
      - financial_facts_modeler
      - is_modeler
      - bs_modeler
      - cf_modeler
      - model_update_executor
      - workbook_builder

  financial_facts_modeler:
    prompt: task2-financial-facts-modeler.md
    description: Uses Task 1 artifacts and MCP evidence to normalize financial facts and write compact Task 2 context.
    parent: task2_financial_modeler
    level: 2
    role: Task 2 data normalization child for sourced historical facts and compact model context.
    inputs:
      - 01_company_research/company_research.md
      - 01_company_research/business_driver_map.json
      - 01_company_research/source_log.json
      - prior Task 2 artifacts for model updates when provided
    outputs:
      - 02_financial_model/financial_facts.json
      - 02_financial_model/task2_context_packet.json
    tool_groups:
      - mcp_tools
      - task2_financial_fact_artifact_tools
    skills:
      single_stock_coverage:
        - financial-data-normalization
        - model-update
    excluded_builtin_tools:
      - task
    subagents: []

  is_modeler:
    prompt: task2-is-modeler.md
    description: Uses compact Task 2 context to produce Revenue Build and Income Statement JSON specs; does not write Excel or read sibling statement outputs.
    parent: task2_financial_modeler
    level: 2
    role: Parallel statement modeler for revenue build and income statement JSON.
    inputs:
      - 02_financial_model/financial_facts.json
      - 02_financial_model/task2_context_packet.json
    outputs:
      - 02_financial_model/revenue_build_spec.json
      - 02_financial_model/income_statement_spec.json
    tool_groups:
      - statement_modeling_tools
    skills:
      single_stock_coverage:
        - financial-data-normalization
        - income-statement-model
        - statement-json-checks
    excluded_builtin_tools:
      - task
    subagents: []

  bs_modeler:
    prompt: task2-bs-modeler.md
    description: Independently produces Balance Sheet JSON spec; does not write Excel or read sibling statement outputs.
    parent: task2_financial_modeler
    level: 2
    role: Parallel statement modeler for balance sheet JSON and retained earnings/cash dependency declarations.
    inputs:
      - 02_financial_model/financial_facts.json
      - 02_financial_model/task2_context_packet.json
    outputs:
      - 02_financial_model/balance_sheet_spec.json
    tool_groups:
      - statement_modeling_tools
    skills:
      single_stock_coverage:
        - financial-data-normalization
        - balance-sheet-model
        - statement-json-checks
    excluded_builtin_tools:
      - task
    subagents: []

  cf_modeler:
    prompt: task2-cf-modeler.md
    description: Independently produces Cash Flow Statement JSON spec; does not write Excel or read sibling statement outputs.
    parent: task2_financial_modeler
    level: 2
    role: Parallel statement modeler for indirect cash flow JSON and cross-statement cash tie dependency declarations.
    inputs:
      - 02_financial_model/financial_facts.json
      - 02_financial_model/task2_context_packet.json
    outputs:
      - 02_financial_model/cash_flow_statement_spec.json
    tool_groups:
      - statement_modeling_tools
    skills:
      single_stock_coverage:
        - financial-data-normalization
        - cash-flow-model
        - statement-json-checks
    excluded_builtin_tools:
      - task
    subagents: []

  model_update_executor:
    prompt: task2-model-update-executor.md
    description: Refreshes an existing integrated_model.xlsx from reconciled updated statement specs without fetching data.
    parent: task2_financial_modeler
    level: 2
    role: Existing-model update child for workbook refresh, validation, and audit handoff.
    inputs:
      - prior 02_financial_model/integrated_model.xlsx
      - 02_financial_model/financial_facts.json
      - 02_financial_model/task2_context_packet.json
      - 02_financial_model/statement_spec_pack.json
    outputs:
      - 02_financial_model/integrated_model.xlsx
      - 02_financial_model/model_audit.md
    tool_groups:
      - workbook_update_tools
      - task2_audit_artifact_tools
    skills:
      single_stock_coverage:
        - model-update
        - three-statement-model
        - xlsx-author
        - audit-xls
    excluded_builtin_tools:
      - task
    subagents: []

  workbook_builder:
    prompt: task2-workbook-builder.md
    description: Builds and validates integrated_model.xlsx from reconciled Task 2 JSON artifacts, then writes model_audit.md.
    parent: task2_financial_modeler
    level: 2
    role: Final Task 2 workbook authoring child for Excel generation, validation, and audit handoff.
    inputs:
      - 02_financial_model/financial_facts.json
      - 02_financial_model/task2_context_packet.json
      - 02_financial_model/statement_spec_pack.json
      - 02_financial_model/revenue_build_spec.json
      - 02_financial_model/income_statement_spec.json
      - 02_financial_model/balance_sheet_spec.json
      - 02_financial_model/cash_flow_statement_spec.json
    outputs:
      - 02_financial_model/integrated_model.xlsx
      - 02_financial_model/model_audit.md
    tool_groups:
      - workbook_authoring_tools
      - task2_audit_artifact_tools
    skills:
      single_stock_coverage:
        - three-statement-model
        - xlsx-author
        - audit-xls
    excluded_builtin_tools:
      - task
    subagents: []

  task3_valuation_analyst:
    prompt: task3-valuation-analyst.md
    description: Parent valuation analyst for evidence gate, value-driver map, assumption audit, model execution, and valuation reconciliation.
    parent: single_stock_coverage
    level: 1
    role: Valuation parent that turns Task 1/2 outputs into audited assumptions and valuation artifacts.
    inputs:
      - 01_company_research/company_research.md
      - 01_company_research/business_driver_map.json
      - 02_financial_model/integrated_model.xlsx
      - 02_financial_model/model_audit.md
    outputs:
      - 03_valuation/assumption_pack.md
      - 03_valuation/valuation_summary.md
      - 03_valuation/dcf_model.xlsx
    tool_groups:
      - mcp_tools
      - coverage_artifact_tools
    skills:
      single_stock_coverage:
        - valuation-methodologies
        - valuation-reconciliation
        - assumption-audit
    subagents:
      - assumption_generator
      - dcf_execution

  assumption_generator:
    prompt: task3-assumption-generator.md
    description: Generates Bear/Base/Bull DCF assumption pack content from evidence and audit feedback.
    parent: task3_valuation_analyst
    level: 2
    role: DCF assumption generation child for Bear/Base/Bull cases.
    inputs:
      - Task 1 company research artifacts
      - Task 2 financial model artifacts
      - parent valuation audit feedback
    outputs:
      - assumption pack content for task3_valuation_analyst
    tool_groups:
      - mcp_tools
      - coverage_artifact_tools
    skills:
      single_stock_coverage:
        - dcf-assumption-generation
        - valuation-methodologies
    subagents: []

  dcf_execution:
    prompt: task3-dcf-execution.md
    description: Builds DCF and comps workbooks from audited assumptions using DCF-builder tools.
    parent: task3_valuation_analyst
    level: 2
    role: DCF and comps execution child using deterministic DCF-builder tools.
    inputs:
      - audited DCF assumption pack
      - Task 2 model handoff artifacts
    outputs:
      - DCF workbook
      - comps workbook
      - DCF validation artifacts
      - valuation summary
    tool_groups:
      - dcf_execution_tools
      - coverage_artifact_tools
    skills:
      dcf_builder:
        - dcf-model
        - comps-analysis
        - valuation-summary
        - audit-xls
        - xlsx-author
    subagents: []

  task4_chart_pack_generator:
    prompt: task4-chart-pack-generator.md
    description: Creates chart_pack artifacts and chart_index.json from Task 1-3 outputs without new research.
    parent: single_stock_coverage
    level: 1
    role: Chart pack generator from completed research, model, and valuation artifacts.
    inputs:
      - Task 1 company research artifacts
      - Task 2 financial model artifacts
      - Task 3 valuation artifacts
    outputs:
      - 04_chart_pack/chart_index.json
      - chart pack artifacts
    tool_groups:
      - coverage_artifact_tools
    skills:
      single_stock_coverage:
        - chart-pack
    subagents: []

  task5_report_assembler:
    prompt: task5-report-assembler.md
    description: Assembles initiation reports or update memos from Task 1-4 artifacts without changing upstream conclusions.
    parent: single_stock_coverage
    level: 1
    role: Final report assembler that preserves upstream conclusions.
    inputs:
      - Task 1 company research artifacts
      - Task 2 financial model artifacts
      - Task 3 valuation artifacts
      - Task 4 chart artifacts
    outputs:
      - 05_report/final_report.md
      - coverage state update
    tool_groups:
      - coverage_artifact_tools
    skills:
      single_stock_coverage:
        - report-assembly
    subagents: []
