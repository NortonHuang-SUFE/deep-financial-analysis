search:
  # ifind-news 已在 mcp 区配置，agent 可直接使用其搜索工具
  # 如需额外的 web 搜索（tavily/serper/duckduckgo），配置 provider 和 api_key
  provider: "none"
  api_key: ""
  max_results: 5

output:
  # Directory where Excel and PPTX artifacts are written, relative to the top-level workspace.
  dir: "./out"
  # Optional: path to a .pptx firm template. Leave blank to use blank layout.
  pptx_template: "./templates/firm-template.pptx"
