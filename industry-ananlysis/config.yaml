# Market Researcher — Configuration
# Fill in your credentials. Never commit tokens or API keys to git.
# Environment variables always override values set here (see .env.example).

model:
  # You can override all of this from .env with:
  #   MODEL_BASE_URL, MODEL_NAME, MODEL_API_KEY, MODEL_MAX_TOKENS
  #
  # Only these OpenAI-compatible gateways are intended for this project:
  #   BabelArk: base_url "https://api.babelark.com", key env BABELARK_API_KEY
  #   MiniMax:  base_url "https://api.minimaxi.com", key env MINIMAX_API_KEY
  #   DeepSeek: base_url "https://api.deepseek.com", key env DEEPSEEK_API_KEY
  #   Alibaba:  base_url "https://dashscope.aliyuncs.com/compatible-mode/v1", key env DASHSCOPE_API_KEY
  #
  # Model examples:
  #   BabelArk: "claude-sonnet-4.6"
  #   MiniMax:  "MiniMax-M2.7"
  #   DeepSeek: "deepseek-chat"
  #   Alibaba:  "qwen3.7-max-preview" or "qwen3-max"
  default: "MiniMax-M2.7"
  max_tokens: 16000
  # The code appends /v1 automatically when needed.
  base_url: "https://api.minimaxi.com"
  # Prefer setting the matching env var in .env. Direct value here also works.
  api_key: ""
  # For DeepSeek V4 + agent tool calling, "disabled" avoids reasoning_content
  # pass-back errors in multi-turn tool loops. Env override: MODEL_THINKING.
  thinking: "auto"

mcp:
  # 同花顺 iFind MCP 数据服务（股票、基金、宏观经济、新闻、债券、全球股票、指数）
  # headers 直接传递给 MCP 客户端（不会自动加 Bearer 前缀）
  # 如果需要添加其他 MCP 服务器，按同样格式添加即可；url 留空则跳过该服务器
