# DCF Builder - Configuration
# Fill credentials through .env whenever possible. Do not commit live tokens.

model:
  # All model calls go through Alibaba DashScope's OpenAI-compatible gateway.
  # Override from the workspace root .env with MODEL_GATEWAY_BASE_URL and
  # MODEL_GATEWAY_API_KEY when needed.
  base_url: "https://dashscope.aliyuncs.com/compatible-mode"
  api_key: ""

  # MODEL_PROFILE can be a profile key below or any direct model id.
  active: "qwen"
  default: "qwen-3.7-max"
  max_tokens: 16000
  thinking: "auto"
  profiles:
    qwen:
      name: "qwen-3.7-max"
      max_tokens: 16000
      thinking: "auto"

mcp:
  # iFind MCP data services. URL values are safe to keep here. iFind uses one
  # shared credential, read only from the workspace root .env as IFIND_MCP_TOKEN
  # or IFIND_MCP_AUTHORIZATION.
  ifind-stock:
    url: "https://api-mcp.51ifind.com:8643/ds-mcp-servers/hexin-ifind-ds-stock-mcp"
    transport: "streamable_http"
  ifind-bond:
    url: "https://api-mcp.51ifind.com:8643/ds-mcp-servers/hexin-ifind-ds-bond-mcp"
    transport: "streamable_http"
  ifind-edb:
    url: "https://api-mcp.51ifind.com:8643/ds-mcp-servers/hexin-ifind-ds-edb-mcp"
    transport: "streamable_http"
  ifind-news:
    url: "https://api-mcp.51ifind.com:8643/ds-mcp-servers/hexin-ifind-ds-news-mcp"
    transport: "streamable_http"
  ifind-index:
    url: "https://api-mcp.51ifind.com:8643/ds-mcp-servers/hexin-ifind-ds-index-mcp"
    transport: "streamable_http"
  ifind-global-stock:
    url: "https://api-mcp.51ifind.com:8643/ds-mcp-servers/hexin-ifind-ds-global-stock-mcp"
    transport: "streamable_http"

search:
  provider: "none"
  api_key: ""
  max_results: 5

output:
  # Directory where artifacts are written, relative to the top-level workspace.
  dir: "./out"
