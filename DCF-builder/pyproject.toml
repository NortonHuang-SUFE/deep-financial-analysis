[project]
name = "dcf-builder"
version = "0.1.1"
description = "LangGraph Deep Agents DCF valuation system — powered by ifind MCP data."
requires-python = ">=3.11"
dependencies = [
    # Deep Agents runtime
    "deepagents>=0.6.1",
    # Remote sandbox backend (used when AGENT_BACKEND=daytona)
    "langchain-daytona>=0.0.7",
    "financial-agent-runtime @ file:../financial-agent-runtime",
    # LangGraph core
    "langgraph>=0.3.0",
    "langgraph-cli[inmem]>=0.3.1",
    "langsmith>=0.3.0",
    # LangChain
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-openai>=0.3.0",
    "langchain-community>=0.3.0",
    # MCP integration
    "langchain-mcp-adapters>=0.1.6",
    "mcp>=1.9.0",
    # Search tools
    "tavily-python>=0.5.0",
    "duckduckgo-search>=3.0.0",
    "google-search-results>=2.4.2",
    # Financial document generation (local only)
    "openpyxl>=3.1.0",
    "python-pptx>=0.6.23",
    "playwright>=1.52.0",
    # Config and utilities
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "httpx>=0.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
